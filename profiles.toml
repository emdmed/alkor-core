# Which profiles exist, what contract pack each reads, and where its server lives.
#
# This is the ONLY file that may name a project outside this repository. Nothing under
# src/core/ or src/modes/ knows such a path; point `pack` and `module` somewhere else and
# the same checkout evaluates a different project.
#
# `pack` is a directory containing a pack.toml manifest, resolved relative to this file.
# Override per profile with PACK_ROOT_<PROFILE> or `--pack DIR` (both resolve against the
# current working directory instead).
#
# `module` is the other half of the same idea, and optional: a path to the profile's
# profile.ts, resolved the same way (PROFILE_MODULE_<PROFILE> overrides it, against cwd).
# Without it the built-in src/profiles/<name>/profile.ts is used. It exists because a
# domain's prompts and its scoring rules are one secret: a project that keeps its pack
# private has no use for a harness that makes it publish the scorer that reads it. Point
# both `pack` and `module` at another repository and that domain lives entirely there.
#
# Profiles generally need DIFFERENT models, so each names its own server. Eval never
# spawns one — a server's flags are part of a measurement and outlive many runs. The
# interactive server (npm run server) DOES manage them on demand: it spawns a profile's
# llama-server at the first run that needs it and stops it after MEDEXTRACT_IDLE_MS of
# idle, so a host keeps in RAM only the models it is actually using. Mark the front-door
# profile `pinned = true` and its model stays resident once brought up — `/route` without
# explicit rules routes through it, so one classifier catches every initial prompt and the
# specialists it names start and stop around it. MEDEXTRACT_MANAGE_MODELS=0 restores the
# manual flow.

# The product-level pipeline is the complete front door: its router chooses one workflow
# from this catalogue, then the server executes that workflow under the same run id. The
# `mode = "pipeline"` entries below are retained as the backwards-compatible storage shape
# for workflow recipes; users do not choose among them during a normal run.
[pipeline]
router = "workflow-router"
workflows = ["clinical-verified", "sepsis-verified"]
default = "clinical-verified"

# The agentic worked example: six tools, no pack, no domain. It is here to exercise the
# tool loop and to be read by someone writing their own profile.
#
# Needs a model whose chat template supports tools. gemma-3 does not, and the loop then
# sees prose where it expects tool_calls.
[coding]
mode = "agentic"
url = "http://127.0.0.1:8082"
model = "~/models/Qwen3-4B-Q4_K_M.gguf"
ctx = 32768

# The reference pack: vital-sign extraction from twelve synthetic clinical notes, English
# and Spanish. Unlike every other pack the harness reads, this one lives IN this repository
# — it is the worked example, so it has to be here to be read.
#
# Gemma 4 E4B Q4_0 is the current default; the pack's models.default.toml pins the exact
# weights and sampling. Historical measurements keep their original model names.
[clinical]
mode = "extract"
pack = "packs/clinical"
url = "http://127.0.0.1:8081"
# This exact local artifact is pinned by sha256 in the pack's model declaration.
model = "~/models/gemma-4-E4B-it-Q4_0.gguf"
ctx = 32768

# The router: a rule-based (and optionally model-based) classifier that decides which
# specialist profile should handle a given input. It requires no pack and no model by
# default — the rules are compiled in. A model fallback can be configured via options.
# Measured: 1.7B drops accuracy to 77.8% when allowed to overrule rules. 4B is the
# minimum that preserves the 98.1% rule-based accuracy.
#
# This remains the measured specialist-classification example and can be run directly. The
# product front door below is separate because its output vocabulary is workflows.
[router]
mode = "router"
url = "http://127.0.0.1:8080"
model = "~/models/Qwen3-4B-Q4_K_M.gguf"
ctx = 8192

# The pipeline router chooses a complete workflow, never an individual specialist. It is
# rules-only: unclear input falls back to the general verified-clinical workflow without a
# classifier model call.
[workflow-router]
mode = "router"
pinned = true

# The verifier: a second-pass model that checks extraction output against the original
# document for hallucinations, quote errors, and unsupported values. Measured: 1.7B models
# fail to catch 10/10 injected errors (too weak for the task). 4B clears the gate.
[verifier]
mode = "extract"
pack = "packs/verifier"
url = "http://127.0.0.1:8085"
model = "~/models/Qwen3-4B-Q4_K_M.gguf"
ctx = 8192

# The verified clinical workflow: extract with the clinical profile, then independently
# verify the constrained completion against the original document.
# The clinical profile already routes input shapes to its own tasks before making a model
# call. A separate top-level router here would not select a step—the extractor is always
# clinical—so this workflow starts directly with extraction.
#
# The verifier's contract is a JSON object with two fields — the ORIGINAL DOCUMENT and the
# EXTRACTION TO VERIFY — which no single pipeline output holds, so the verify step composes
# its input as a template: `initial` for the document and the clinical step's normalized
# structured output for the extraction. This resolves to a profile's reviewed `report` when
# it has one and otherwise to its raw constrained completion. The distinction matters for a
# multi-task clinical route: it has one combined report but no single raw completion.
# The verifier decodes a JSON string before it builds its own prompt, and refuses plain text.
[clinical-verified]
mode = "pipeline"
# The pipeline definition: a list of steps. Each step has a name, a profile, and an input
# reference. Input references: `initial` for the original input, `step-N` for the output
# of step N (0-indexed), `step-N.raw` for the raw completion, `step-N.text` for rendered
# text, `step-N.report` for the structured report. An OBJECT composes refs into one JSON
# input for a step that needs more than one file of state.
steps = [
  { name = "extract", profile = "clinical", input = "initial" },
  { name = "verify-derived", profile = "clinical-verifier", input = { document = "initial", extraction = "step-0.output" } },
  { name = "verify-source", profile = "verifier", input = "step-1.output" }
]

[clinical-verifier]
mode = "router"
pack = "packs/clinical"

# A deterministic qSOFA verification path. The clinical model produces the sepsis reply;
# the second step checks its echoes, cited criteria, verdict, and score against the same
# pack thresholds and medprotocol command used by the clinical answer key.
[sepsis-verify]
mode = "extract"
pack = "packs/clinical"
url = "http://127.0.0.1:8081"

[sepsis-verified]
mode = "pipeline"
steps = [
  { name = "extract", profile = "clinical", input = "initial" },
  { name = "verify", profile = "sepsis-verify", input = { document = "initial", extraction = "step-0.raw" } }
]

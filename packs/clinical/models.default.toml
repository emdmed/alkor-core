# What "the model" means for this pack.
#
# A recall figure quoted without the weights, the quantisation and the token cap it ran
# under is not reproducible, and a pack that does not state them invites its numbers to be
# read as properties of the harness. This file is that statement, and it is data so that a
# consuming application can seed its own runtime config from the same declaration the eval
# used.

[generation]
# A label, not a lookup. Whatever produced a stored result should stay attributable to it,
# so this changes whenever the weights change.
id = "gemma-4-E4B-it-Q4_0"

# Where the weights come from for a fresh machine. The harness does not download anything
# — it talks to a server you started — but the default must still resolve to one exact
# artifact. The 2026-09-09 shock run in RESULTS.md is the first measurement of these bytes.
hf_repo = "ggml-org/gemma-4-E4B-it-GGUF"
hf_file = "gemma-4-E4B-it-Q4_0.gguf"
sha256 = "a555b900214b477d8880e7832e0b8925e139b0159640036b09fe472b6f2097f2"
size_bytes = 4590807392

# 32768 costs additional KV cache on top of the 4.6 GB weights. It is declared rather than
# hardcoded precisely so a low-memory machine can drop it; this task's inputs are single
# notes and would fit in far less.
ctx_size = 32768

# --jinja applies the model's own chat template. Required, not optional: without it
# `chat_template_kwargs` below is silently ignored.
jinja = true

# Keep template-controlled thinking off for extraction. Nothing here reads
# `reasoning_content`, and the measured shock run used this setting.
enable_thinking = false

# --no-webui: llama-server serves a chat UI by default, which has no business being
# reachable from a machine handling clinical text and is not what the port is for.
# --parallel 1: one slot. Extra slots only fragment the KV cache `cache_prompt` depends on.
extra_args = ["--no-webui", "--parallel", "1"]

# --- Per-task sampling. ---
#
# temperature 0 on a graded task is the point rather than a preference: the task emits a
# JSON contract, and two runs over the same note must agree or the eval is measuring dice
# rather than the model.
#
# top_p is deliberately ABSENT. At temperature 0 it does nothing, and matching another
# runtime's request body means omitting the field, not setting it to the same number.

[sampling.vital_signs]
temperature = 0.0
# The whole answer is one closed object of at most eleven short fields. 1024 is roughly
# four times a maximal legal response, which leaves room for a model that pads without
# letting a runaway generation hold the run open until the timeout.
max_tokens = 1024
timeout_secs = 300

# Three bounded arrays over a whole record. The cap must sit ABOVE 3 arrays × 20 items × a
# line's worth of tokens, or a legal maximal response truncates mid-array and every long
# summary becomes a parse failure — a cap that turns a good answer into a broken one is
# measuring the budget rather than the model. See patient-summary.schema.json.
#
# The timeout is longer than the others because the INPUT is longer: this task's user message
# is a whole record assembled from several notes, so the prefill alone is several times a
# single note's.
[sampling.patient_summary]
temperature = 0.0
max_tokens = 2048
timeout_secs = 600

# One note in, four sections out, every item carrying a quote AND a derived text. The ceiling
# that matters is 3 arrays × 15 items × two strings each, and quotes are whole sentences
# rather than short values — so this is capped like the summary and not like vital signs,
# even though its input is a single note.
[sampling.note_format]
temperature = 0.0
max_tokens = 2048
timeout_secs = 300

# The same output contract as note_format, so the same ceiling on the answer — but the INPUT
# is speech, which is roughly twice the words of the written note carrying the same facts:
# fillers, retracted spans that stay in the transcript, and dictated punctuation all occupy
# prefill. The quotes are longer for the same reason, since a span containing a correction has
# to be quoted whole to be quotable at all, so the cap stays at the summary's rather than
# dropping to what the sections alone would need.
#
# The DEADLINE is three times the other tasks', and it was raised from 300 the day the corpus
# grew a two-speaker consultation. A dialogue is the longest input and the longest answer this
# task has: the same facts arrive spread over forty short turns, and an item whose drug and dose
# sit in different turns must quote the run that spans both, so the quotes lengthen with the
# input. On a loaded iGPU at 4 tok/s `tr-en-19-dialogue-correction` was still generating at 300s,
# nowhere near the 2048-token cap, and was killed — scoring 0 on every item and reading in the
# table as a model that found nothing. That is a transport limit wearing a model result's
# clothing, which is the one thing a deadline here must not do. It is a backstop against a hung
# server, and a backstop that binds on a legitimate answer has stopped being one.
[sampling.transcript]
temperature = 0.0
max_tokens = 2048
timeout_secs = 900

# --- The repair pass over a dictated reading's failed citations. ---
# Half the transcript cap. The input is bigger than the transcript task's — the whole
# transcript AGAIN, plus the items that failed — but the OUTPUT is a handful of spans copied
# off a page, not a reading, and it is bounded by how many items failed rather than by how much
# the consultation contained. A cap sized for a full reading would be a cap that never binds,
# which is a cap that stops reporting anything about the pass it governs.
[sampling.transcript_repair]
temperature = 0.0
max_tokens = 1024
timeout_secs = 300

# --- The medication pass over a dictated transcript. ---
# The INPUT is the whole transcript again — the same prefill the first pass paid for, and mostly
# reused, since `cache_prompt` sees the same user message behind a different system prompt. The
# OUTPUT is one bounded array of short items, which is why the cap is a quarter of the reading's:
# fifteen drugs at a quote, a name and a dose each fits several times over in 512, and a cap that
# cannot bind on a legal answer is a cap that reports nothing about the pass it governs.
#
# The deadline is the transcript task's, not the short one. This call reads the same speech, and
# the six-drug Spanish dictation took 77 s of generation on a loaded iGPU — a backstop that binds
# on a legitimate polypharmacy list is a transport limit wearing a model result's clothing.
[sampling.medication]
temperature = 0.0
# 1024, and it was 512 for one measured run. `tr-es-14-polimedicado` names six drugs, and six
# items of quote-plus-name-plus-dose do not fit: the completion stopped at the cap mid-string,
# the reply would not parse, and the pass fell back to the first reading — silently, because
# falling back is what this pass does when it cannot answer. A polypharmacy list is exactly the
# case the pass exists for, so a cap that binds there is a cap that turns it off where it is
# needed most, and reports nothing while doing it.
max_tokens = 1024
timeout_secs = 900

# --- The literature pass over a finished note. ---
# The smallest output in the pack: three short objects, no quotes longer than a line. 512 is
# several times a maximal legal reply, which is the same ratio vital signs runs at — a cap that
# cannot bind on a good answer, and a backstop against a model that starts writing prose.
#
# The INPUT is the note rather than the transcript, which is why the deadline is the short one:
# a written note is a fraction of the speech it came from, and this pass follows two calls the
# clinician has already waited through. A third long wait for a panel nobody asked for would be
# the feature paying for itself out of the wrong pocket.
[sampling.literature]
temperature = 0.0
max_tokens = 512
timeout_secs = 120

# --- The shock-category pass over a fixed examination payload. ---
# The SMALLEST cap in this file, and the input is the smallest too: seven lines in, one closed
# object of eight short fields out. Two of the fields are enum members, two are arrays bounded
# at five enum members each, and the only free text is two sentences. 512 is roughly four times
# a maximal legal response, on the same reasoning as vital_signs.
#
# A tight cap is worth more here than elsewhere because of what overrunning it would MEAN. This
# contract's whole subject is whether the model reasons from the payload or narrates around it,
# and a model that needs more than 512 tokens for seven lines of input has answered the wrong
# question — a cap that never binds would let that happen silently and report the category.
# THE DEADLINE IS NOT THE CAP, and this file said otherwise for exactly one run. `max_tokens`
# above is sized to the ANSWER, which is tiny and stays tiny. `timeout_secs` is sized to the
# slowest MACHINE anyone points this pack at, and those are unrelated quantities — the first is
# a property of the contract, the second is a property of somebody's hardware. Setting the
# deadline to 120 "because the output is small" conflated them, and the whole corpus came back
# as twenty parse failures on a CPU-only box: one cold case there measured 324 s wall, 1990
# tokens of prefill at 11 tok/s and 85 tokens of generation at 0.6 tok/s. Every case reported
# `cannot reach llama-server`, which reads as a server that is down rather than a deadline that
# is short — the gates correctly refused to pass on nothing, and nothing in the output said the
# number was the harness's own fault.
#
# 900 matches the transcript task's and is chosen the same way: comfortably above a COLD case on
# hardware where nothing is offloaded to a GPU. On a machine with one it is never approached.
[sampling.shock]
temperature = 0.0
max_tokens = 512
timeout_secs = 900

# --- The shock-extraction pass over a free-text clinical note. ---
# The cap is the SAME as the transcript task's, because the input is a note and the output is a
# single closed object of seven fields, but the note may carry filler prose that the model has to
# read through to find the findings. The ceiling is the note-format task's rather than the shock
# reasoning task's, because the input is prose and not a pre-rendered payload.
[sampling.shock_extraction]
temperature = 0.0
max_tokens = 1024
timeout_secs = 300

# --- The sepsis-screening pass over a fixed Quick SOFA payload. ---
# The SMALLEST input in this file — six lines in, one closed object of nine short fields out —
# and the cap is the shock task's for the same reason it is there: this contract's whole subject
# is whether the model reads the CLI's verdict rather than narrating around it, so a cap that
# never binds would let a model that answered the wrong question report a number anyway. 512 is
# several times a maximal legal response and is the same ratio shock runs at.
#
# The deadline matches the shock task's: the input is a pre-rendered payload so the prefill is
# tiny, but the server it runs on is the same shared machine, and a cold case there measures the
# same wall time whichever of the two tasks asked for it. On a machine with an offloaded GPU it is
# never approached.
[sampling.sepsis]
temperature = 0.0
max_tokens = 512
timeout_secs = 900

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-33.96 -39 78 78">
  <!--
    The star pair from Logotype.tsx, at favicon size. Same geometry, squared canvas:
    the mark's bounding box centres on x=5.04, and 78 units of side leave Mizar at 77%
    of the canvas, which is as full as the disc can sit without the crescent touching
    the edge.

    TWO COLOURS, AS IN THE PRODUCT. Mizar is the accent and Alcor is the counter — the
    same two roles the lockup uses, so the tab icon and the top bar are the same mark
    rather than two drawings of it. The companion used to be the accent again at 54%
    alpha, which is the treatment the product itself dropped: the faintness belongs to
    occlusion, not to opacity, and an alpha crescent is the one thing that does not
    survive being flattened.

    #e2542a is one value in both themes — the accent does not have a dark variant, which
    is why there is no colour query on it. What DOES follow the tab strip is Alcor: the
    counter is white on a dark strip and black on a light one, exactly as in the app,
    because it is the crescent's separation from the disc that has to hold at 16px.

    Safari falls back to favicon.png below, which carries the light values only.
  -->
  <style>
    .mizar { fill: #e2542a }
    .alcor { fill: #000000 }
    @media (prefers-color-scheme: dark) {
      .alcor { fill: #ffffff }
    }
  </style>
  <circle class="alcor" cx="25.38" cy="-11.83" r="14.70" />
  <circle class="mizar" cx="0" cy="0" r="30" />
</svg>
